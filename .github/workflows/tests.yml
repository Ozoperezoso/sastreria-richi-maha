# Runs every test suite against a local Supabase stack (seed data only, never production).
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - run: npm ci

      - name: Start Supabase
        # Studio, image proxy, logs and the pooler are not used by the app or the tests.
        run: npx supabase start -x studio,imgproxy,logflare,vector,supavisor

      - name: Write .env.local from the local stack
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } > .env.local

      - name: Database (pgTAP)
        run: npx supabase test db

      - name: Unit
        run: npm test

      - name: Integration
        run: npm run test:int

      - run: npx playwright install --with-deps chromium

      - name: End to end
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: .superpowers/playwright-results
          retention-days: 7
